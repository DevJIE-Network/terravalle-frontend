# Configuración de SonarQube Cloud para terravalle-frontend.
# La organización y la clave del proyecto se copian de SonarQube Cloud
# (Information del proyecto) al importar el repositorio.
sonar.organization=devjie-network
sonar.projectKey=DevJIE-Network_terravalle-frontend
sonar.projectName=TerraValle Frontend

# Código fuente (React + Vite)
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Pruebas (Vitest) y reporte de cobertura
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info
